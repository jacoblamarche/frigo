[project]
name = "frigo"
version = "0.1.0"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Form() et Depends() en valeur par défaut : c'est l'usage de FastAPI.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form"]

[tool.pytest.ini_options]
testpaths = ["tests"]
