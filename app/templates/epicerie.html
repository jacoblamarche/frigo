{% extends "base.html" %}
{% block title %}Épicerie · frigo{% endblock %}
{% block heading %}Épicerie <span class="sub" id="count">{{ total }} à acheter</span>{% endblock %}
{% block content %}
<section class="screen">
  <form class="add" method="post" action="/epicerie/ajouter" data-async data-reset>
    <input name="texte" placeholder="Ajouter un article…" autocomplete="off" required aria-label="Article">
    <input type="hidden" name="filtre" value="{{ tag }}">
    <button class="btn">Ajouter</button>
  </form>
  <p class="hint">« lait 2 L » ou « oignons 2 #lasagne » · <a href="#coller" data-toggle="paste">Coller une liste</a> · <a href="/epicerie/stock">Toujours en stock</a></p>
  <form class="paste" id="paste" method="post" action="/epicerie/ajouter" data-async data-reset>
    <textarea name="texte" placeholder="Un article par ligne&#10;3 oignons&#10;1 lb bœuf haché&#10;pâtes à lasagne" aria-label="Liste d'articles"></textarea>
    <div class="row">
      <input name="etiquette" placeholder="Étiquette pour toute la liste (ex. Lasagne)" aria-label="Étiquette">
      <input type="hidden" name="filtre" value="{{ tag }}">
      <button class="btn">Ajouter tout</button>
    </div>
  </form>
  <div id="liste" data-src="/epicerie/liste{{ '?etiquette=' ~ tag|urlencode if tag }}" data-etag='"{{ version }}"'>
    {% include "_epicerie_liste.html" %}
  </div>
</section>
{% endblock %}
